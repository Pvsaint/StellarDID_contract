name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  STELLAR_CLI_VERSION: "22.0.0"

jobs:
  ci:
    name: Build, Test, Lint & Fmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-1.88.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.88.0-

      - name: Install Stellar CLI (pre-built binary)
        run: |
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Build (WASM)
        run: make build

      - name: Test (native host target)
        run: make test

      - name: Lint (Clippy)
        run: make lint

      - name: Format check
        run: cargo fmt --all -- --check
